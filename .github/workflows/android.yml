name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Lint, test, and assemble
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          :app:lintDebug
          :app:lintPrivilegedDebug
          :app:testDebugUnitTest
          :libs:lpac-jni:testDebugUnitTest
          :app:assembleDebug
          :app:assemblePrivilegedDebug
          :app:assembleDebugAndroidTest
      - name: Run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon --dependency-verification strict :app:connectedDebugAndroidTest
      - name: Verify privileged permission separation
        shell: bash
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          ordinary_apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n 1)"
          privileged_apk="$(find app/build/outputs/apk/privilegedDebug -type f -name '*.apk' | sort | head -n 1)"
          test -n "$aapt"
          test -n "$ordinary_apk"
          test -n "$privileged_apk"
          ordinary_permissions="$("$aapt" dump permissions "$ordinary_apk")"
          privileged_permissions="$("$aapt" dump permissions "$privileged_apk")"
          for permission in READ_PHONE_STATE READ_PRIVILEGED_PHONE_STATE MODIFY_PHONE_STATE; do
            if grep -Fq "android.permission.$permission" <<<"$ordinary_permissions"; then
              echo "Ordinary debug APK unexpectedly declares android.permission.$permission" >&2
              exit 1
            fi
            grep -Fq "android.permission.$permission" <<<"$privileged_permissions"
          done
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-privilegedDebug.html
            app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
